<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Operaciones cripto — Fase 1: Tesorería y confirmación manual</title>
  <desc id="desc">Diagrama de compra y venta de criptoactivos con registro en POS, atención de Tesorería y confirmación manual antes de completar el movimiento de caja.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16845b"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:750}.subtitle{font-size:15px;fill:#64748b}.lane{fill:#f8fafc;stroke:#dbe4ef;stroke-width:1.5}.laneTitle{font-size:18px;font-weight:700}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12}.boxBlue{fill:#eff6ff;stroke:#93c5fd}.boxGreen{fill:#ecfdf5;stroke:#86efac}.boxAmber{fill:#fff7ed;stroke:#fdba74}.boxRed{fill:#fff1f2;stroke:#fda4af}.head{font-size:16px;font-weight:700}.body{font-size:13px;fill:#475569}.small{font-size:12px;fill:#64748b}.tag{font-size:11px;font-weight:700}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.lineGreen{fill:none;stroke:#16845b;stroke-width:2;marker-end:url(#greenArrow)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1440" height="980" fill="#fff"/>
  <text x="48" y="55" class="title">Operaciones cripto · Fase 1</text>
  <text x="48" y="83" class="subtitle">Tesorería administra la billetera; el cajero registra la operación y una persona confirma manualmente cada transferencia.</text>

  <!-- Participants -->
  <rect x="40" y="110" width="1360" height="78" rx="14" fill="#f1f5f9" stroke="#dbe4ef"/>
  <text x="70" y="142" class="head">PARTICIPANTES</text>
  <text x="70" y="166" class="small">Cliente</text>
  <text x="315" y="166" class="small">Cajero · POS</text>
  <text x="640" y="166" class="small">Tesorería · operador autorizado</text>
  <text x="1030" y="166" class="small">Billetera corporativa / red</text>
  <path d="M265 150H300M570 150H625M950 150H1015" class="line"/>

  <!-- Buy flow -->
  <rect x="40" y="210" width="1360" height="330" rx="16" class="lane"/>
  <text x="68" y="245" class="laneTitle">A. Comprar cripto al cliente</text>
  <text x="370" y="245" class="small">El cliente entrega cripto y recibe efectivo en BOB.</text>
  <rect x="70" y="280" width="235" height="105" class="box boxBlue"/>
  <text x="90" y="310" class="head">1 · Cotizar</text><text x="90" y="336" class="body">Activo, red, monto, precio</text><text x="90" y="357" class="body">y comisión acordados.</text>
  <rect x="355" y="280" width="245" height="105" class="box"/>
  <text x="375" y="310" class="head">2 · Crear operación</text><text x="375" y="336" class="body">POS la guarda como</text><text x="375" y="357" class="body">Pendiente de recepción.</text>
  <rect x="650" y="280" width="245" height="105" class="box boxAmber"/>
  <text x="670" y="310" class="head">3 · Verificar recepción</text><text x="670" y="336" class="body">Tesorería revisa billetera,</text><text x="670" y="357" class="body">red, monto y referencia.</text>
  <rect x="945" y="280" width="245" height="105" class="box boxGreen"/>
  <text x="965" y="310" class="head">4 · Confirmar manualmente</text><text x="965" y="336" class="body">Registra hash / referencia</text><text x="965" y="357" class="body">y confirma fondos recibidos.</text>
  <rect x="1240" y="280" width="130" height="105" class="box boxGreen"/>
  <text x="1260" y="310" class="head">5 · Pagar</text><text x="1260" y="336" class="body">Cajero entrega</text><text x="1260" y="357" class="body">BOB desde caja.</text>
  <path d="M305 333H347M600 333H642M895 333H937M1190 333H1232" class="line"/>
  <rect x="355" y="420" width="540" height="78" class="box boxRed"/>
  <text x="375" y="449" class="head">Si no se confirma la recepción</text><text x="375" y="474" class="body">Permanece pendiente; no pagar BOB. Tesorería puede rechazarla con motivo.</text>
  <path d="M772 385V410" class="line dash"/>
  <path d="M625 459H315V393" class="line dash"/>

  <!-- Sell flow -->
  <rect x="40" y="560" width="1360" height="330" rx="16" class="lane"/>
  <text x="68" y="595" class="laneTitle">B. Vender cripto al cliente</text>
  <text x="370" y="595" class="small">El cliente entrega BOB y recibe cripto de la billetera de Tesorería.</text>
  <rect x="70" y="630" width="235" height="105" class="box boxBlue"/>
  <text x="90" y="660" class="head">1 · Cotizar</text><text x="90" y="686" class="body">Activo, red, monto, precio</text><text x="90" y="707" class="body">y comisión acordados.</text>
  <rect x="355" y="630" width="245" height="105" class="box"/>
  <text x="375" y="660" class="head">2 · Crear operación</text><text x="375" y="686" class="body">POS registra el cobro BOB</text><text x="375" y="707" class="body">y dirección del cliente.</text>
  <rect x="650" y="630" width="245" height="105" class="box boxAmber"/>
  <text x="670" y="660" class="head">3 · Revisar pago</text><text x="670" y="686" class="body">Cajero confirma el efectivo</text><text x="670" y="707" class="body">en la caja seleccionada.</text>
  <rect x="945" y="630" width="245" height="105" class="box boxGreen"/>
  <text x="965" y="660" class="head">4 · Enviar manualmente</text><text x="965" y="686" class="body">Tesorería verifica dirección,</text><text x="965" y="707" class="body">red y monto antes del envío.</text>
  <rect x="1240" y="630" width="130" height="105" class="box boxGreen"/>
  <text x="1260" y="660" class="head">5 · Confirmar</text><text x="1260" y="686" class="body">Guarda hash</text><text x="1260" y="707" class="body">y completa.</text>
  <path d="M305 683H347M600 683H642M895 683H937M1190 683H1232" class="line"/>
  <rect x="355" y="770" width="540" height="78" class="box boxRed"/>
  <text x="375" y="799" class="head">Si la dirección o red no coincide</text><text x="375" y="824" class="body">Detener el envío y dejar pendiente hasta corregir o cancelar con autorización.</text>
  <path d="M1068 735V760" class="line dash"/>

  <!-- Rules -->
  <rect x="40" y="910" width="1360" height="48" rx="12" fill="#172b4d"/>
  <text x="64" y="940" font-size="13" font-weight="700" fill="#fff">Regla de fase 1:</text>
  <text x="180" y="940" font-size="13" fill="#fff">sin confirmación manual no se completa la operación; cada confirmación queda auditada con usuario, fecha y referencia.</text>
</svg>
